<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'self' blob:; base-uri 'none'; form-action 'none'; manifest-src 'self'">
  <title>Obsidian Web · biblioteca local</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0c0e14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>

  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 2.5 21 12l-9 9.5L3 12Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3.5 10.5 8.5-7 8.5 7V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.7 6.3.9-4.6 4.4 1.1 6.2-5.5-3-5.5 3 1.1-6.2L3 9.6l6.3-.9Z"/></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 3.5 7.5 20.5M16.5 3.5l-2 17M4 8.5h16M3.5 15.5h16"/></symbol>
    <symbol id="i-graph" viewBox="0 0 24 24"><circle cx="6" cy="17" r="2.6"/><circle cx="12" cy="6" r="2.6"/><circle cx="18" cy="15" r="2.6"/><path d="m7.5 14.6 3.2-6.3M14.2 7.7l2.7 5.1M8.6 16.8l6.7-.9"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M4 7h3.2c3.5 0 5.3 10 8.8 10H20M17 4l3 3-3 3M4 17h3.2c1.4 0 2.5-1.6 3.5-3.4M17 14l3 3-3 3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6M20 5v6h-6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6M20 6v12"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h4"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1L10.5 5.4M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.5-1.5"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.8 20h18.4Z"/><path d="M12 9v5M12 17h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12.5 5 5 10-11"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16Z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4ZM20 4h-6a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h6Z"/></symbol>
  </svg>

  <div id="app">
    <aside id="sidebar" aria-label="Navegación de la bóveda">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-logo"></use></svg></div>
        <div class="brand-copy">
          <strong>Obsidian Web</strong>
          <span id="vaultName">Sin bóveda abierta</span>
          <span id="modeBadge" class="mode-badge" hidden></span>
        </div>
        <button id="toggleSidebar" class="icon-btn only-mobile" title="Cerrar menú" aria-label="Cerrar menú"><svg class="icon"><use href="#i-close"></use></svg></button>
      </div>

      <div class="vault-actions">
        <button id="openVault" class="primary-btn">Abrir carpeta</button>
        <button id="reopenVault" class="ghost-btn" hidden>Reabrir última</button>
        <input id="fallbackPicker" type="file" webkitdirectory multiple hidden>
      </div>

      <p id="writeNotice" class="write-notice" role="status" hidden></p>

      <div class="privacy-pill" title="El navegador lee tus archivos localmente. No se envían a ningún servidor.">
        <span class="dot"></span> Todo se lee en tu navegador
      </div>

      <label class="search-wrap" for="searchInput">
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="searchInput" type="search" placeholder="Buscar en la bóveda…" autocomplete="off" spellcheck="false">
        <kbd>Ctrl K</kbd>
      </label>

      <nav class="quick-nav" aria-label="Vistas">
        <button data-view="home" class="nav-btn active"><svg class="icon"><use href="#i-home"></use></svg> Inicio</button>
        <button data-view="recent" class="nav-btn"><svg class="icon"><use href="#i-clock"></use></svg> Recientes</button>
        <button data-view="favorites" class="nav-btn"><svg class="icon"><use href="#i-star"></use></svg> Favoritos</button>
        <button data-view="tags" class="nav-btn"><svg class="icon"><use href="#i-hash"></use></svg> Etiquetas</button>
        <button data-view="graph" class="nav-btn"><svg class="icon"><use href="#i-graph"></use></svg> Grafo</button>
      </nav>

      <div class="tree-head">
        <span>Archivos</span>
        <span class="tree-head-actions">
          <button id="newNote" class="icon-btn" title="Nueva nota" aria-label="Nueva nota"><svg class="icon"><use href="#i-plus"></use></svg></button>
          <button id="collapseTree" class="icon-btn" title="Contraer o expandir carpetas" aria-label="Contraer carpetas"><svg class="icon"><use href="#i-collapse"></use></svg></button>
        </span>
      </div>
      <div id="fileTree" class="file-tree" aria-label="Archivos de la bóveda"></div>

      <footer class="sidebar-foot">
        <span id="vaultStats">0 notas</span>
        <span>·</span>
        <span>100% local</span>
      </footer>
    </aside>

    <main id="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn only-mobile" title="Abrir menú" aria-label="Abrir menú"><svg class="icon"><use href="#i-menu"></use></svg></button>
        <nav id="breadcrumbs" class="breadcrumbs" aria-label="Ruta"></nav>
        <div class="top-actions">
          <button id="openPalette" class="icon-btn" title="Buscar nota (Ctrl K)" aria-label="Buscar nota"><svg class="icon"><use href="#i-search"></use></svg></button>
          <button id="randomNote" class="icon-btn" title="Nota al azar" aria-label="Nota al azar"><svg class="icon"><use href="#i-shuffle"></use></svg></button>
          <button id="reloadVault" class="icon-btn" title="Recargar desde el disco" aria-label="Recargar desde el disco"><svg class="icon"><use href="#i-refresh"></use></svg></button>
          <button id="themeToggle" class="icon-btn" title="Cambiar tema" aria-label="Cambiar tema"><svg class="icon"><use href="#i-sun"></use></svg></button>
          <button id="inspectorToggle" class="icon-btn only-narrow" title="Mostrar detalles de la nota" aria-label="Mostrar detalles de la nota"><svg class="icon"><use href="#i-panel"></use></svg></button>
        </div>
      </header>

      <div class="workspace">
        <section id="view" class="view" aria-busy="false" tabindex="-1"></section>
        <aside id="inspector" class="inspector" aria-label="Detalles de la nota"></aside>
      </div>
    </main>
  </div>

  <button id="scrim" class="scrim" tabindex="-1" aria-label="Cerrar paneles"></button>

  <div id="palette" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="paletteLabel">
    <div class="modal-card">
      <div class="modal-search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="paletteInput" placeholder="Buscar una nota…" autocomplete="off" spellcheck="false" aria-labelledby="paletteLabel">
        <kbd>Esc</kbd>
      </div>
      <p id="paletteLabel" class="visually-hidden">Buscar y abrir una nota</p>
      <div id="paletteResults" class="palette-results" role="listbox" aria-label="Notas encontradas"></div>
      <div class="modal-hint">↑ ↓ para moverte · Enter para abrir · Esc para cerrar</div>
    </div>
  </div>

  <div id="attachmentViewer" class="modal viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
    <div class="viewer-card">
      <header class="viewer-head">
        <strong id="viewerTitle">Adjunto</strong>
        <span class="viewer-actions">
          <a id="viewerDownload" class="icon-btn" href="#" download aria-label="Descargar adjunto" title="Descargar"><svg class="icon"><use href="#i-download"></use></svg></a>
          <button id="viewerClose" class="icon-btn" aria-label="Cerrar visor" title="Cerrar"><svg class="icon"><use href="#i-close"></use></svg></button>
        </span>
      </header>
      <div id="viewerBody" class="viewer-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="graphTip" class="graph-tip" hidden></div>

  <script src="vendor/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
  <script src="vendor/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
  <script src="core.js"></script>
  <script src="writing.js"></script>
  <script src="app.js"></script>
</body>
</html>
